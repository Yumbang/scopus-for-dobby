[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "scopus-for-dobby"
version = "1.0.0"
description = "Stateful CLI for Scopus academic database — search, collect, and manage research papers locally."
readme = "README.md"
license = "MIT"
# Floor, not target. The project's default interpreter is pinned to 3.14 in
# `.python-version`; CI tests both ends of this range.
requires-python = ">=3.10"
authors = [{ name = "ybang" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
# Everything the CLI needs to work out of the box. `click` and
# `prompt-toolkit` back the console script and the REPL — the entry point
# cannot even import without them — and `openpyxl` backs `export`'s default
# `--format xlsx`. Splitting these into extras only created installs that
# resolve fine and then fail on first use.
dependencies = [
    "requests>=2.28.0",
    "duckdb>=1.0.0",
    "click>=8.0.0",
    "prompt-toolkit>=3.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
# The HTTP daemon (`scopus-for-dobby serve`) and everything that speaks to
# it. Required by the macOS GUI, and by anyone who wants two processes on
# the database at once. The CLI runs against DuckDB in-process without it
# — see the module docstring in `cli/_client.py`. This is the only extra
# that changes what you get.
gui = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
]
# Community detection over citation-graph projections. Everything else
# `openalex analyze` reports is stdlib set arithmetic and needs nothing here.
analysis = [
    # >=3.4 for the `edges` keyword on node_link_graph; see write_json.
    "networkx>=3.4",
]
# Deprecated aliases, kept so existing install lines keep resolving.
# `cli` and `export` are empty because their contents are core deps now.
cli = []
export = []
gui-support = ["scopus-for-dobby[gui]"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    # The test suite covers both DB backends, so it needs the daemon stack.
    # `fastapi.testclient` requires httpx.
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    # ...and the analysis extra, so community detection is actually exercised.
    "networkx>=3.4",
]

[project.scripts]
scopus-for-dobby = "scopus_for_dobby.cli:main"

[tool.setuptools.packages.find]
where = ["."]

# The agent skill ships inside the package so `skill install` works from any
# install, with no repo checkout. Without this it is absent from the wheel and
# the command fails only for people who installed normally.
[tool.setuptools.package-data]
scopus_for_dobby = ["skill/*/SKILL.md", "skill/*/references/*.md"]

[tool.ruff]
# Deliberately the floor from requires-python, not the default interpreter:
# this is what stops pyupgrade rewriting code into syntax that 3.10 cannot
# parse. Raise it only together with requires-python.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "S",     # flake8-bandit (security)
]
ignore = [
    "S603",  # subprocess call - check for execution of untrusted input
    "S607",  # start process with partial path
    "S608",  # SQL injection - false positive (queries built from hardcoded strings)
    "S110",  # try-except-pass - intentional for REPL startup resilience
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101"]  # allow assert in tests
"scopus_for_dobby/server/app.py" = ["B008"]  # FastAPI Body(...) idiom in defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
