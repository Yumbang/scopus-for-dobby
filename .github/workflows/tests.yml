name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is the project default (see .python-version); 3.10 is the
        # floor declared by requires-python. Testing both ends means a
        # 3.14-only syntax slip or a dropped-3.10 dependency shows up here.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create venv and install dev deps
        # setup-uv with python-version already provisions .venv; --clear
        # replaces it instead of erroring on the existing one.
        run: |
          uv venv --clear
          uv pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: uv run ruff check .

      # No `ruff format --check` gate: parts of the codebase keep
      # hand-curated formatting (e.g. core/article_db.py) and the repo has
      # never been format-clean. `ruff check` is the enforced gate.

      - name: Tests (pytest)
        run: uv run pytest -q

  cli-only:
    # The daemon stack (fastapi/uvicorn/httpx) lives in the optional [gui]
    # extra — see ADR-7a. Installing without it must still give a working
    # CLI running against DuckDB in-process. Without this job, a stray
    # top-level `import httpx` would put the deps silently back into core.
    name: CLI-only install (no [gui] extra)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Install without the daemon extra
        run: |
          uv venv --clear
          uv pip install -e . pytest

      - name: Assert the daemon stack really is absent
        run: |
          uv run python - <<'PY'
          import importlib.util as u, sys
          leaked = [m for m in ("fastapi", "uvicorn", "httpx", "starlette")
                    if u.find_spec(m) is not None]
          if leaked:
              sys.exit(f"[gui] deps leaked into a CLI-only install: {leaked}")
          print("clean: no daemon stack installed")
          PY

      - name: Tests (in-process backend)
        run: uv run pytest -q

      - name: Smoke-test the CLI end to end
        run: |
          uv run scopus-for-dobby db stats
          uv run scopus-for-dobby --json collection create ci-smoke
          uv run scopus-for-dobby --json collection list
          # No daemon may have been spawned along the way.
          test ! -e "$HOME/.scopus-for-dobby/daemon.pid" \
            || (echo "a daemon was spawned by a plain CLI command" && exit 1)

  skill-packaging:
    # `skill install` reads files shipped as package-data. A missing glob in
    # pyproject still passes the test suite (which runs from the source tree)
    # and fails only for people who installed from a wheel — so install from a
    # built wheel, outside the repo, and prove the skill lands.
    name: Skill ships in the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Build wheel and install it outside the source tree
        # `rm -rf build` matters: setuptools reuses build/lib, so files from a
        # previous layout survive there and get packaged alongside the current
        # ones. Harmless on a fresh runner, but this job exists to catch
        # packaging faults, so it should not depend on the checkout being new.
        run: |
          rm -rf build dist
          uv venv --clear
          uv build --wheel -o dist
          uv pip install dist/*.whl

      - name: Install the skill from the wheel
        run: |
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cd "$RUNNER_TEMP/elsewhere"
          CLI="$GITHUB_WORKSPACE/.venv/bin/scopus-for-dobby"
          "$CLI" skill list
          "$CLI" skill install
          test -f "$HOME/.claude/skills/scopus-for-dobby/SKILL.md" \
            || (echo "SKILL.md missing — package-data glob is wrong" && exit 1)
          test -n "$(ls "$HOME/.claude/skills/scopus-for-dobby/references/"*.md)" \
            || (echo "references/ missing from the wheel" && exit 1)
          "$CLI" skill install agents --project
          test -f AGENTS.md || (echo "AGENTS.md pointer not written" && exit 1)

  macos-gui:
    name: macOS GUI build
    # Needs Xcode 16+: current xcodegen emits project format 77, which
    # Xcode 15.x (macos-14 default) cannot open.
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project and build
        working-directory: gui-macos
        # Scheme name "ScopusForDobby" is taken directly from project.yml
        # (targets.ScopusForDobby / PRODUCT_NAME). CODE_SIGNING_ALLOWED=NO
        # keeps the build unsigned so it runs on the hosted runner.
        run: |
          xcodegen generate
          xcodebuild \
            -project ScopusForDobby.xcodeproj \
            -scheme ScopusForDobby \
            -destination 'platform=macOS' \
            build CODE_SIGNING_ALLOWED=NO
