<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>scopus-for-dobby · macOS GUI design</title>
  <link rel="stylesheet" href="tokens.css"/>
  <link rel="stylesheet" href="components.css"/>
  <style>
    html, body { margin: 0; height: 100%; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; color: #2A2723; }
    .canvas-intro { display: flex; flex-direction: column; gap: 6px; max-width: 880px; }
    .canvas-intro .kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: #8A8175; font-weight: 600; }
    .canvas-intro h1 { font-family: "Tiempos Text", "Charter", "New York", Georgia, serif; font-size: 36px; font-weight: 500; letter-spacing: -0.015em; margin: 0; line-height: 1.1; }
    .canvas-intro p { font-size: 14px; color: #5C554B; line-height: 1.55; max-width: 64ch; margin: 0; }
    .badge-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: #F2E0D5; color: #6B2D14; border-radius: 999px; font-size: 11px; font-weight: 500; }
    /* small frame plate inside artboards */
    .anno { position: absolute; top: 14px; left: 16px; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: #8A8175; font-weight: 600; }
    .legend { font-size: 11px; color: #5C554B; line-height: 1.55; max-width: 50ch; }
    .swatch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; }
    .sw { display: flex; flex-direction: column; gap: 4px; font-size: 11px; }
    .sw .chip-color { height: 56px; border-radius: 6px; border: 1px solid rgba(0,0,0,.06); }
    .sw .name { font-weight: 600; color: #2A2723; }
    .sw .val { color: #8A8175; font-family: ui-monospace, monospace; font-size: 10.5px; }
    .typescale { display: flex; flex-direction: column; gap: 14px; padding: 24px; background: #FAF9F5; border-radius: 8px; }
    .typescale .row { display: flex; align-items: baseline; gap: 18px; padding-bottom: 14px; border-bottom: 1px solid #EDE7DC; }
    .typescale .row:last-child { border: 0; padding: 0; }
    .typescale .label { width: 90px; font-size: 10.5px; color: #8A8175; text-transform: uppercase; letter-spacing: .08em; flex-shrink: 0; }
    .typescale .meta { margin-left: auto; font-size: 10.5px; color: #8A8175; font-family: ui-monospace, monospace; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="icons.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="frames.jsx"></script>
  <script type="text/babel" src="detail.jsx"></script>
  <script type="text/babel" src="states.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
